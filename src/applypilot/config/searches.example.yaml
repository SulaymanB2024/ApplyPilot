# ApplyPilot search configuration
# Copy to your ApplyPilot user data directory as searches.yaml and customize.
# The wizard (applypilot init) generates a basic version automatically.

# Discovery mode:
#   hybrid         = direct sources plus configured JobSpy boards (default)
#   direct_sources = Workday + sites.yaml entries marked direct_source: true only
#   job_boards     = configured JobSpy boards only
discovery_mode: hybrid

# Progressive aggregation is explicit and bounded. Repeated CLI --term values
# select provider queries; the overlay never expands every configured query.
aggregation:
  default_mode: quick
  quick_deadline_seconds: 15
  deep_deadline_seconds: 90
  per_source_timeout_seconds: 30
  max_concurrency: 8
  workday_max_employers: 12
  workday_max_query_terms: 3
  smart_extract_max_targets: 6
  cache_max_age_days: 14
  automatic_sources: [cache, direct_ats, workday, smart_extract]
  enrichment_sources: [jobspy, handshake_browser, runway_browser]
  jobspy:
    enabled: true
    boards: [indeed, google, zip_recruiter]
    max_query_terms: 2
    max_locations: 2
    results_per_board: 25
    max_workers: 3
    deadline_seconds: 30
    use_proxies: false
    fetch_full_descriptions: false
  browser_portals:
    enabled: [handshake, runway]
    serialized: true
    max_results_per_portal: 25
    max_navigations_per_portal: 30
    deadline_seconds_per_portal: 180
    checkpoint_seconds: 5
  opportunities:
    enabled: true
    recent_funding_days: 45
    max_company_leads: 25
    max_drafts_per_run: 10
    require_send_authorization: true

direct_sources:
  workday: true
  direct_ats: true
  smartextract: true

jobspy_enabled: true

# Optional employer-owned Greenhouse, Lever, and Ashby boards.
# In direct_sources mode these run without JobSpy or aggregators.
direct_ats_sources:
  - name: "Anthropic Greenhouse"
    url: "https://job-boards.greenhouse.io/anthropic"
  - name: "OpenAI Ashby"
    url: "https://jobs.ashbyhq.com/openai"
  - name: "AccuWeather Greenhouse"
    url: "https://job-boards.greenhouse.io/accuweather"
  - name: "NuvoAir Lever"
    url: "https://jobs.lever.co/NuvoAir"
  - name: "Phamily Greenhouse"
    url: "https://job-boards.greenhouse.io/jobsatphamily"
  - name: "TPG Greenhouse"
    url: "https://job-boards.greenhouse.io/tpgcareers"
  - name: "Enova Greenhouse"
    url: "https://job-boards.greenhouse.io/enova"
  - name: "Cohere Ashby"
    url: "https://jobs.ashbyhq.com/cohere"
  - name: "Waabi Lever"
    url: "https://jobs.lever.co/waabi"

direct_ats_title_keywords:
  - "intern"
  - "internship"
  - "analyst"
  - "new grad"
  - "graduate"
  - "early career"
  - "associate"
  - "coordinator"

# Search every configured query tier. Precision belongs in scoring/ranking;
# direct discovery should not silently discard the broad-recall tier.
direct_ats_max_tier: 3
workday_max_tier: 3
workday_title_filter: true

# Search queries -- each has a query string and priority tier.
# Tier 1: High-priority exact matches (searched first, highest precision)
# Tier 2: Strong matches, broader scope
# Tier 3: Wide net, high volume, lower precision
queries:
  - query: "software engineer"
    tier: 1
  - query: "backend engineer"
    tier: 1
  - query: "backend developer"
    tier: 1
  - query: "full stack developer"
    tier: 2
  - query: "full stack engineer"
    tier: 2
  - query: "python developer"
    tier: 2
  - query: "python engineer"
    tier: 2
  - query: "DevOps engineer"
    tier: 2
  - query: "site reliability engineer"
    tier: 2
  - query: "platform engineer"
    tier: 2
  - query: "cloud engineer"
    tier: 2
  - query: "data engineer"
    tier: 2
  - query: "infrastructure engineer"
    tier: 2
  - query: "software developer"
    tier: 3
  - query: "developer"
    tier: 3
  - query: "systems engineer"
    tier: 3
  - query: "automation engineer"
    tier: 3
  - query: "solutions engineer"
    tier: 3
  - query: "integration engineer"
    tier: 3
  - query: "ML engineer"
    tier: 3
  - query: "machine learning engineer"
    tier: 3
  - query: "AI engineer"
    tier: 3
  - query: "security engineer"
    tier: 3

# Locations to search
locations:
  - location: "San Francisco, CA"
    remote: false
  - location: "Remote"
    remote: true

# Location filtering -- accept/reject patterns for job location text
location:
  accept_patterns:
    - "San Francisco"
    - "Bay Area"
    - "SF"
    - "California"
    - "CA"
    - "Remote"
    - "Anywhere"
    - "United States"
    - "US"
    - "USA"
  reject_patterns:
    - "New York only"
    - "Seattle only"
    - "onsite only"
    - "London, UK"
    - "India"
    - "Philippines"

# Country for Indeed/LinkedIn/Google Jobs searches
country: "USA"

# JobSpy source boards (all available options shown)
boards:
  - indeed
  - linkedin
  - glassdoor
  - zip_recruiter
  - google

# Search defaults
defaults:
  results_per_site: 100  # Max results per board per query
  hours_old: 72          # Only jobs posted within this many hours

# Negative keywords -- skip jobs with these in the title (case-insensitive)
exclude_titles:
  - "senior"
  - "staff"
  - "principal"
  - "lead"
  - "senior director"
  - "VP "
  - "vice president"
  - "chief"
  - "clearance required"
  - "TS/SCI"
  - "principal scientist"
